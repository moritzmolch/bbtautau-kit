name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.69.0

      # - name: Install dependencies
      #   run: |
      #     pixi run -e dev pip install -e ".[dev]"

      - name: Run linting
        run: |
          pixi run -e dev ruff check src/ tests/

      # - name: Run tests
