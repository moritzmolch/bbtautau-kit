[workspace]
authors = ["moritzmolch <moritz.molch@kit.edu>"]
channels = ["conda-forge"]
name = "bbtautau-kit"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
order = ">=2.1.7, <3"

[feature.dev.dependencies]
ruff = ">=0.11.5,<1"
basedpyright = ">=1.39.8,<2"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
