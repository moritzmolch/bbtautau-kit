[workspace]
authors = ["moritzmolch <moritz.molch@kit.edu>"]
channels = ["conda-forge"]
name = "bbtautau-kit"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
pyyaml = ">=6.0.3,<7"

[pypi-dependencies]
order = ">=2.1.7, <3"
bbtautau-kit = { path = ".", editable = true }

[feature.dev.dependencies]
ruff = ">=0.11.5,<1"
basedpyright = ">=1.39.8,<2"
pytest = ">=8.0.0,<9"
pytest-cov = ">=5.0.0,<6"
pytest-mock = ">=3.14.0,<4"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
