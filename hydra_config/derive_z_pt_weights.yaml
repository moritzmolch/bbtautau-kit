# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- inventory: control_regions_z_pt
- _self_

# Input (merged histograms of the shapes tag) and output directory
merged_histograms_dir: ${artifacts.merged_histograms_dir}
output_dir: ${artifacts.z_pt_weights_dir}

# Campaigns to derive weights for. One correctionlib file per campaign
campaigns: ${inventory.campaigns}

# The weights are derived exclusively in this channel
channel: mm

# Categories with exclusive jet multiplicities, inclusive in b jets
categories:
- mm_eq2j
- mm_eq3j
- mm_geq4j

# Histograms used for the normalization and for the pt correction
yield_variable: yield
pt_variable: pt_vis

# Merge adjacent pt bins before deriving the correction
rebin: 1

# Merge adjacent pt bins (from low to high pt) until the statistical
# uncertainty of the ratio in each bin is below this value. Set to null to
# disable. Applied after the fixed rebinning.
max_rel_error: 0.05

# Smooth the pt correction with a Gaussian kernel (width in GeV) to obtain a
# continuous approximation, evaluated on a grid with the given step. The
# kernel average weights the bins by their inverse variance. If enabled, the
# merging above is skipped and the fine binning is smoothed instead.
smoothing_sigma: null
smoothing_grid_step: 1.0

# Optional limits on the pt correction factors
min_value: null
max_value: null
