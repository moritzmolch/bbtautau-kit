# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- inventory: control_regions_z_pt
- _self_

tags:
  shapes_tag: "shapes-2026-10-14-for-zpt-reweighting"

# Input (merged histograms of the shapes tag) and output directory
merged_histograms_dir: ${artifacts.merged_histograms_dir}
output_dir: ${artifacts.z_pt_weights_dir}

# Campaigns to derive weights for. One correctionlib file per campaign
campaigns: ${inventory.campaigns}

# The weights are derived exclusively in this channel
channel: mm

# Categories to derive the corrections in, with exclusive jet multiplicities
# and inclusive in b jets. One entry of the correction per category
categories:
- mm_eq0j
- mm_eq1j
- mm_eq2j
- mm_eq3j
- mm_geq4j

# Histograms used for the normalization (yield) and for the pt correction
yield_variable: yield
pt_variable: pt_vis

# Settings of the pt correction. The keys of `default` apply to all
# categories. A category can override any of them with an entry named like the
# category, listing only the keys that differ. Keys:
#   rebin:               Merge this many adjacent pt bins of the histogram
#                        before deriving the correction (1 = no merging).
#   max_rel_error:       Merge adjacent pt bins (from low to high pt) until the
#                        statistical uncertainty of the ratio in each bin is
#                        below this value. null disables the merging. Ignored
#                        if smoothing is enabled, which needs the fine binning.
#   smoothing_sigma:     Width in GeV of the Gaussian kernel that smooths the
#                        binwise ratios into a continuous approximation. The
#                        bins are weighted by their expected inverse variance.
#                        null disables the smoothing. If enabled, the ratios
#                        before smoothing are stored too, for the control plots.
#   smoothing_grid_step: Step in GeV of the grid on which the smoothed
#                        correction is evaluated and stored.
#   pt_clip:             All pt bins above this value in GeV (lower edge at or
#                        above it) are merged into a single tail bin, which is
#                        not smoothed. null for no tail bin.
derivation_settings:
  default:
    rebin: 1
    max_rel_error: 0.025
    smoothing_sigma: 1.0
    smoothing_grid_step: 1.0
    pt_clip: 100
  mm_eq2j:
    rebin: 2
    max_rel_error: 0.025
    smoothing_sigma: 2.0
    smoothing_grid_step: 2.0
    pt_clip: 100
  mm_eq3j:
    rebin: 3
    max_rel_error: 0.025
    smoothing_sigma: 4.0
    smoothing_grid_step: 4.0
    pt_clip: 100
  mm_geq4j:
    rebin: 5
    max_rel_error: 0.025
    smoothing_sigma: 8.0
    smoothing_grid_step: 8.0
    pt_clip: 100
