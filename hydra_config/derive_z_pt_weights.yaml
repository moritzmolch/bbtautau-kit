# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- inventory: control_regions_z_pt
- _self_

# Input (histograms of the shapes tag) and output directory
histograms_dir: ${artifacts.histograms_dir}
output_dir: ${artifacts.z_pt_weights_dir}

# Analysis channel and categories considered for this correction. The pt
# weights are derived in categories with exclusive jet multiplicities (tag
# `jet_cat`)
channel: "mm"
categories:
- "mm_eq2j"
- "mm_geq3j"

# Information needed for histogram processing
# - The pt_variable defines the histogram which is used to derive the weights
# - The process_tag is used to identify the process of interest and to subtract
#   contamination from other processes
pt_variable: pt_vis
process_tag: z

# Uncertainties
# - unc_rel_norm_other: Relative uncertainty in the normalization of processes
#   which are subtracted from data
unc_rel_norm_other: 0.1

# Kernel regression smoothing of the binwise data / simulation ratio
# - bw: Bandwidth in GeV, or "auto" to choose per campaign and category the
#   largest bandwidth of a scan for which the binned ratio is still compatible
#   with the smoothed curve (chi2/ndf <= chi2_ndf_max)
# - n_samples: Number of samples within the statistical uncertainties. The
#   mean and standard deviation give the weights and their stat. uncertainty
# - var_min, var_max, var_steps: Grid on which the smoothed result is evaluated
# - bw_down_factor, bw_up_factor: Factors for the bandwidth variations
# - bw_scan_min, bw_scan_max, bw_scan_steps: Geometric bandwidth grid (GeV) of
#   the scan for bw=auto
# - chi2_ndf_max: Largest accepted chi2/ndf in the scan
# - overrides: Replace any of the settings above per campaign and category
#   (campaigns and categories not listed use the defaults)
smoothing:
  bw: auto
  n_samples: 100
  var_min: 0.0
  var_max: 500.0
  var_steps: 5000
  bw_down_factor: 0.5
  bw_up_factor: 2.0
  bw_scan_min: 0.5
  bw_scan_max: 100.0
  bw_scan_steps: 60
  chi2_ndf_max: 1.0
  # Overrides of the settings above per campaign and category. A numeric bw
  # disables the scan for that category, e.g.
  # 2024_nano_v15: {mm_eq2j: {bw: 10.0}}
  overrides: {}
