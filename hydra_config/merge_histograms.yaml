# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- inventory: default
- _self_

# Explicitly define input and output files
graph_specs_file: ${artifacts.graph_specs_file}
histograms_dir: ${artifacts.histograms_dir}
output_dir: ${artifacts.merged_histograms_dir}

# Number of worker processes used for the merging. A value of 1 processes the
# independent merge tasks sequentially in the current process.
num_workers: 8
