# Inventory for the distributions of the classifier (NN) output scores.
#
# The classifier categories only exist if the profile contains signals, so run
# with, for example:
#   bin/shapes_ff inventory=nn hydra.job.env_set.XYH_PROFILE=BENCHMARK_GRID
# The fake-factor chain is needed because the "default" process set contains
# jetfakes, whose histograms come from the fake-factor stage.
#
# The entries of `categories` are regular expressions that are matched in full
# against the category names of each channel, e.g. "mt_clf_.*" selects all
# classifier categories (all output classes and mass hypotheses) of the mt
# channel. Plain category names also work. Patterns that match nothing in a
# channel are ignored for this channel.

# The factory function to set up the inventory
factory_fn: "xyh.config.inventory.create_inventory"
factory_fn_kwargs:
  process_set: "default"

# Filter and weight functions
filters_fn: "xyh.filters.default_filters"
weights_fn: "xyh.weights.default_weights"

# Analysis context: campaigns, channels, categories, and variables to process
campaigns:
# - "2022_pre_ee_nano_v12"
# - "2022_post_ee_nano_v12"
# - "2023_pre_bpix_nano_v12"
# - "2023_post_bpix_nano_v12"
- "2024_nano_v15"
# - "2025_nano_v15"
channels:
- "et"
- "mt"
- "tt"
categories:
- "et_clf_.*"
- "mt_clf_.*"
- "tt_clf_.*"
variables:
- "max_score"
