# `run_graphs` preset for the loose TauFakeFactors preselection snapshots:
#   python3 -m xyh.shape_processor.run_graphs --config-name run_graphs_ff tags.shapes_tag=<tag>
# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- base/snapshots_ff@snapshots
- base/binning@binning
- inventory: fake_factors
- _self_

# Settings for multi-threaded graph processing. The mode selects the produced
# output files: "histogram" and "snapshot" for the production, "binning" to
# derive the data-driven binning, see `xyh.binning`.
graph_processing:
  num_workers: 8
  num_threads: 8
  mode: "snapshot"

# Settings for profiling the graph processing in `run_graphs`
profiling:
  enabled: false      # Master switch for all profiling output
  cprofile: true      # Whole-run cProfile of the Python entry point
  stages: true        # Per-node and per-subgraph wall-time instrumentation
  rdataframe: true    # ROOT RDataFrame report (filter efficiencies, events)
  memory: true        # Memory usage / peak RSS tracking

# Explicitly define input and output files
dataset_specs_file: ${artifacts.dataset_specs_file}
binning_specs_file: ${artifacts.binning_specs_file}
filters_and_weights_specs_file: ${artifacts.filters_and_weights_specs_file}
graph_specs_file: ${artifacts.graph_specs_file}
histogram_keys_file: ${artifacts.histogram_keys_file}
histograms_output_dir: ${artifacts.histograms_dir}
snapshots_output_dir: ${artifacts.snapshots_dir}
binning_output_dir: ${artifacts.binning_dir}

# Output files for the profiling report
profiling_report_file: data/output/${tags.shapes_tag}/profiling_report.json.gz
cprofile_file: data/output/${tags.shapes_tag}/specs/profile_output.prof