# Base hydra configuration for the shape_processor CLI.
#
# The config contains parameters relevant to many/all shape_processor CLI
# interfaces. Specific CLI configuration files use these parameters as there
# default values. The set of parameters can be extended and/or overridden by
# settings in these files.
#
# Command-line overrides use Hydra's dot-notation syntax, e.g.
#
#   python -m xyh.shape_processor.create_dataset_specs campaigns=[2024] channels=[mt]
#
# `hydra.job.chdir: false` keeps the working directory unchanged so that
# relative paths in the config (e.g. `../data/...`) resolve as before.
# 
# Default values for environment variables can be set with the
# `hydra.job.env_set` entry.

# Tags for input and output artifacts
tags:
  ntuple_tag: "ntuples-2026-06-10"
  shapes_tag: "shapes-2026-09-15"

# Artifact paths
artifacts:
  dataset_specs_file: data/output/${tags.shapes_tag}/specs/datasets.json.gz
  filters_and_weights_specs_file: data/output/${tags.shapes_tag}/specs/filters_and_weights.json.gz
  histogram_specs_file: data/output/${tags.shapes_tag}/specs/histograms.json.gz
  graph_specs_file: data/output/${tags.shapes_tag}/specs/graphs.json.gz
  histograms_dir: data/output/${tags.shapes_tag}/histograms
  merged_histograms_dir: data/output/${tags.shapes_tag}/merged_histograms
  control_plots_dir: data/output/${tags.shapes_tag}/control_plots

# Basic information about analysis inventory to be used
inventory:
  factory_fn: "xyh.config.inventory.create_inventory"
  factory_fn_kwargs:
    process_set: "default"
  filters_fn: "xyh.filters.default_filters"
  weights_fn: "xyh.weights.default_weights"
  variables:
  - "yield"
  - "pt_1"
  - "eta_1"
  - "phi_1"
  - "mass_1[tt]"
  - "iso_1"
  - "tau_decaymode_1[tt]"
  - "pt_2"
  - "eta_2"
  - "phi_2"
  - "mass_2[et,mt,tt]"
  - "iso_2"
  - "tau_decaymode_2[tt]"
  - "m_vis"
  - "pt_vis"
  - "deltaR_ditaupair"
  - "bpair_pt_1"
  - "bpair_eta_1"
  - "bpair_phi_1"
  - "bpair_btag_value_1"
  - "bpair_pt_2"
  - "bpair_eta_2"
  - "bpair_phi_2"
  - "bpair_btag_value_2"
  - "bpair_m_inv"
  - "bpair_pt_dijet"
  - "bpair_deltaR"
  - "bpair_pt_regressed_1"
  - "bpair_eta_regressed_1"
  - "bpair_phi_regressed_1"
  - "bpair_btag_value_regressed_1"
  - "bpair_pt_regressed_2"
  - "bpair_eta_regressed_2"
  - "bpair_phi_regressed_2"
  - "bpair_btag_value_regressed_2"
  - "bpair_m_inv_regressed"
  - "bpair_pt_dijet_regressed"
  - "bpair_deltaR_regressed"
  - "jpt_1"
  - "jpt_regressed_1"
  - "jpt_regressed_1"
  - "jpt_regressed_resolution_1"
  - "jpt_nano_1"
  - "jpt_raw_1"
  - "jpt_l1_1"
  - "jpt_l2rel_1"
  - "jpt_l2l3res_1"
  - "jeta_1"
  - "jphi_1"
  - "jtag_value_1"
  - "jpt_2"
  - "jpt_regressed_2"
  - "jpt_regressed_resolution_2"
  - "jpt_nano_2"
  - "jpt_raw_2"
  - "jpt_l1_2"
  - "jpt_l2rel_2"
  - "jpt_l2l3res_2"
  - "jeta_2"
  - "jphi_2"
  - "jtag_value_2"
  - "met"
  - "met_raw"
  - "met_uncorrected"
  - "metphi"
  - "metphi_raw"
  - "metphi_uncorrected"
  - "mt_1[et,mt,tt]"
  - "mt_2[et,mt,tt]"
  - "mt_tot[et,mt,tt]"
  - "n_jets"
  - "n_bjets"

# NTuple information
ntuples:
  xrootd_server: "root://cmsdcache-kit-disk.gridka.de:1094"
  base_dir: "/store/user/mmolch/CROWN/ntuples"
  friends:
  - name: "fake-factors-2026-09-26" # "fake-factors-2026-06-10", "pnn-2026-07-10"
    channels: ["et", "mt", "tt"]
    exclude_datasets: ["^xyh_.*$"]

# Settings for multi-threaded graph processing
graph_processing:
  num_workers: 16
  num_threads: 2

# Control plot settings
control_plots:
  extensions: ["png", "pdf"]

# Logging
log_level: INFO


# Hydra-specific config
hydra:
  run:
    dir: "data/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  job:
    chdir: false
    env_set:
      XYH_SAMPLE_DATABASE: "/work/mmolch/xyh-bbtautau-crown/KingMaker/sample_database"
      XYH_PROFILE: "BKG_ONLY"
