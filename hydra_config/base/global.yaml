# @package _global_

# Logging
log_level: INFO

# Data-driven Z corrections, see `xyh.shape_processor.derive_z_pt_weights`
z_pt_weights:
  # Production (shapes tag) from which the corrections are taken. If set and
  # different from `tags.shapes_tag`, the workflow derives the corrections
  # first and applies them in this production.
  tag: null
  # Hydra overrides for the production the corrections are derived from, on
  # top of the user overrides (they take precedence)
  overrides:
  - "inventory=control_regions_z_pt"
  # Directory with the correctionlib files that are applied in this
  # production. Empty disables the corrections. Set by the workflow.
  input_dir: "data/output/shapes-2026-10-16-for-z-pt-reweighting/z_pt_weights"

# B-tag weight normalization corrections applied in `b_jet_weights`, see
# `xyh.btag_weight_renormalization`. One file per era and channel is required
# for every campaign that is processed.
btag_renorm_weights:
  input_dir: "data/output/btag_renorm_weights/btag-renorm-2026-10-22"

# Binning that overrides the one of the inventory, see
# `xyh.shape_processor.derive_binning`. Empty uses the inventory binning.
binning_overrides:
  file: ""

# Hydra-specific config
hydra:
  run:
    dir: "data/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  job:
    chdir: false
    env_set:
      XYH_SAMPLE_DATABASE: "/work/mmolch/xyh-bbtautau-crown/KingMaker/sample_database"
      XYH_PROFILE: "BKG_ONLY" # BKG_ONLY, BENCHMARK, FULL
      # Directory with the correctionlib files of the Z corrections. Prefer
      # `z_pt_weights.input_dir`, which takes precedence if set.
      XYH_Z_PT_WEIGHTS_DIR: ""
      # Directory with the correctionlib files of the b-tag weight
      # normalization. Prefer `btag_renorm_weights.input_dir`, which takes
      # precedence if set.
      XYH_BTAG_RENORM_WEIGHTS_DIR: ""
