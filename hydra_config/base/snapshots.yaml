# Settings for the snapshot output of `run_graphs` in snapshot mode, see
# `xyh.core.specs.graph._snapshot`.
#
# Explicit list of columns to write to the snapshot. `null` (the default)
# writes all columns of the input data frame. Entries are shell-style glob
# patterns, matched against each column's plain name and its friend-qualified
# name, e.g. "fPt" or "fastmtt.*". Like the inventory variables, an entry may
# restrict a column to a subset of channels: "<name>[<channel 1>,<channel 2>,...]"
# writes the column only in those channels, e.g. "mass_2[et,mt,tt]".
columns:
- "pt_1"
- "eta_1"
- "phi_1"
- "mass_1[tt]"
- "iso_1"
- "tau_decaymode_1[tt]"
- "pt_2"
