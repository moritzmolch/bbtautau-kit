# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- inventory: default
- _self_

# Explicitly define input and output files
graph_specs_file: ${artifacts.graph_specs_file}
merged_histograms_dir: ${artifacts.merged_histograms_dir}
output_dir: ${artifacts.control_plots_dir}

# Number of worker processes used for producing the control plots. A value of
# 1 processes the independent plot tasks sequentially in the current process.
num_workers: 8

# Set image extensions
control_plots:
  extensions: ["png", "pdf"]