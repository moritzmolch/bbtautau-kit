# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- inventory: default
- _self_

# Derive an equipopulated binning from data, see
# `xyh.shape_processor.derive_binning`. The binning is derived for every
# campaign, channel and category of the inventory.
binning:
  # Shapes tag whose specs (selections and ntuple file lists) are used. A
  # production (at least `run_graphs`) of this tag must exist.
  specs_tag: ${tags.shapes_tag}
  # Process group providing the events the binning is derived from
  data_process_group: "data"
  # Defaults for all variables
  n_bins: 10
  precision: 4
  # Limit the number of ntuple files per dataset, e.g. for tests
  n_files: null
  # Variables to derive the binning for. Each can override `n_bins`,
  # `precision` and `range: [low, high]`. Variables that are not defined for a
  # channel (empty binning in the inventory) are skipped.
  variables:
    m_vis: {}
    pt_1: {}
    pt_2: {}
  # Output file to be set as `binning_overrides.file` in `run_graphs`, and
  # directory with control plots of the data with the derived binning
  output_file: data/output/${tags.shapes_tag}/binning/binning.json
  plots_dir: data/output/${tags.shapes_tag}/binning/plots
