# Load base parameters as default
defaults:
- base/global
- base/artifacts@artifacts
- base/ntuples@ntuples
- base/tags@tags
- inventory: default
- _self_

# Settings for multi-threaded graph processing
graph_processing:
  num_workers: 8
  num_threads: 8
  mode: "histogram"

# Settings for profiling the graph processing in `run_graphs`
profiling:
  enabled: false      # Master switch for all profiling output
  cprofile: true      # Whole-run cProfile of the Python entry point
  stages: true        # Per-node and per-subgraph wall-time instrumentation
  rdataframe: true    # ROOT RDataFrame report (filter efficiencies, events)
  memory: true        # Memory usage / peak RSS tracking

# Explicitly define input and output files
histograms_output_dir: ${artifacts.histograms_dir}
snapshots_output_dir: ${artifacts.snapshots_dir}

# Output files for the profiling report
profiling_report_file: data/output/${tags.shapes_tag}/profiling_report.json.gz
cprofile_file: data/output/${tags.shapes_tag}/specs/profile_output.prof